    <script>
      /* Proportional zoom: keeps the same UI-to-viewport ratio across desktop resolutions.
         Baseline = 2200×1240. Below 1280px (mobile) we drop zoom and let media queries take over. */
      (function () {
        var BASE_W = 2200;
        var BASE_H = 1240;
        var MIN_W = 1280;
        function applyZoom() {
          var w = window.innerWidth;
          var h = window.innerHeight;
          if (w < MIN_W) {
            document.documentElement.style.zoom = '';
            return;
          }
          var z = Math.min(w / BASE_W, h / BASE_H);
          document.documentElement.style.zoom = z.toFixed(3);
        }
        applyZoom();
        window.addEventListener('resize', applyZoom);
      })();
    </script>
