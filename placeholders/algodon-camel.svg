<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7c5a7"/>
      <stop offset="1" stop-color="#b89a6b"/>
    </linearGradient>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(60)">
      <rect width="14" height="14" fill="transparent"/>
      <rect width="5" height="14" fill="#504030" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#stripes)"/>
  <text x='400' y='340' font-family='sans-serif' font-size='220' font-weight='700' text-anchor='middle' fill='#8a6a4a' fill-opacity='0.35'>4</text></svg>
