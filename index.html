    <script>
      /* Proportional zoom: keeps the same UI-to-viewport ratio across desktop resolutions.

      (function () {
        var BASE_W = 2200;
        var BASE_H = 1240;
        var MIN_W = 1280;
        function applyZoom() {
          var w = window.innerWidth;
          var h = window.innerHeight;
          if (w < MIN_W) {
